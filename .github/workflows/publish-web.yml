name: Publicar site e atualizações
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sudoklue-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar assets do site
        run: npm run build:web
      - name: Gerar pacote de atualização
        run: python3 tools/create_update.py
      - name: Incluir Duelo de Relíquias no site
        run: |
          mkdir -p dist-pages/duelo-de-reliquias
          cp duelo-de-reliquias/index.html dist-pages/duelo-de-reliquias/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Publicar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
